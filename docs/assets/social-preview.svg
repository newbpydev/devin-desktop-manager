<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Devin Desktop Manager</title>
  <desc id="desc">Unofficial Linux installer and manager for Devin Desktop with verified installs, transactional updates, and rollback without sudo.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e1b"/>
      <stop offset="1" stop-color="#111d34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="terminal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1050" cy="70" r="230" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1180" cy="560" r="260" fill="#a78bfa" opacity="0.07"/>

  <g font-family="DejaVu Sans, Noto Sans, sans-serif">
    <rect x="80" y="78" width="304" height="36" rx="18" fill="#0d2039" stroke="#1e3a5f"/>
    <text x="100" y="102" font-size="14" font-weight="bold" letter-spacing="2.4" fill="#7dd3fc">UNOFFICIAL · LINUX X86_64</text>

    <text x="80" y="205" font-size="62" font-weight="bold" fill="#f8fafc">Devin Desktop</text>
    <text x="80" y="272" font-size="62" font-weight="bold" fill="url(#accent)">Manager</text>

    <text x="82" y="337" font-size="24" fill="#cbd5e1">Verified installs. Transactional updates.</text>
    <text x="82" y="371" font-size="24" fill="#cbd5e1">Rollback without sudo.</text>

    <g font-size="16" font-weight="bold">
      <rect x="80" y="423" width="196" height="40" rx="20" fill="#0c1c31" stroke="#1f3b5c"/>
      <circle cx="104" cy="443" r="8" fill="#34d399"/>
      <text x="122" y="449" fill="#dbeafe">SHA-256 verified</text>

      <rect x="291" y="423" width="150" height="40" rx="20" fill="#0c1c31" stroke="#1f3b5c"/>
      <circle cx="315" cy="443" r="8" fill="#7dd3fc"/>
      <text x="333" y="449" fill="#dbeafe">XDG-native</text>

      <rect x="456" y="423" width="132" height="40" rx="20" fill="#0c1c31" stroke="#1f3b5c"/>
      <circle cx="480" cy="443" r="8" fill="#a78bfa"/>
      <text x="498" y="449" fill="#dbeafe">No root</text>
    </g>
  </g>

  <g font-family="DejaVu Sans Mono, monospace" transform="translate(700 145)">
    <rect width="500" height="352" rx="18" fill="#0a1526" stroke="#263853" stroke-width="1.5" filter="url(#terminal-shadow)"/>
    <path d="M 18 0 H 482 A 18 18 0 0 1 500 18 V 48 H 0 V 18 A 18 18 0 0 1 18 0 Z" fill="#111f36"/>
    <circle cx="22" cy="24" r="6" fill="#f87171"/>
    <circle cx="42" cy="24" r="6" fill="#fbbf24"/>
    <circle cx="62" cy="24" r="6" fill="#34d399"/>
    <text x="86" y="29" font-size="14" fill="#94a3b8">devin-desktop-manager</text>

    <text x="28" y="90" font-size="16" fill="#4ade80">$</text>
    <text x="50" y="90" font-size="16" fill="#e2e8f0">make check</text>
    <text x="28" y="122" font-size="16" fill="#94a3b8">Current:</text>
    <text x="112" y="122" font-size="16" fill="#f8fafc">3.14.30819</text>
    <text x="28" y="152" font-size="16" fill="#94a3b8">Status:</text>
    <text x="112" y="152" font-size="16" fill="#34d399">up to date</text>

    <text x="28" y="214" font-size="16" fill="#4ade80">$</text>
    <text x="50" y="214" font-size="16" fill="#e2e8f0">make update</text>
    <text x="28" y="246" font-size="16" fill="#34d399">verified official SHA-256</text>
    <text x="28" y="278" font-size="16" fill="#f8fafc">installation is active</text>

    <g transform="translate(420 206)">
      <circle cx="0" cy="0" r="16" fill="#34d399"/>
      <path d="M -7 1 L -2 6 L 8 -5" fill="none" stroke="#06251b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g font-family="DejaVu Sans Mono, monospace">
    <text x="80" y="570" font-size="18" fill="#94a3b8">github.com/newbpydev/devin-desktop-manager</text>
  </g>
  <text x="80" y="601" font-size="14" fill="#64748b" font-family="DejaVu Sans, Noto Sans, sans-serif">Unofficial project. Not affiliated with Cognition.</text>
</svg>
