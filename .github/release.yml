changelog:
  exclude:
    labels:
      - dependencies
      - github_actions
      - release
  categories:
    - title: Fixes
      labels:
        - bug
        - regression
    - title: Compatibility
      labels:
        - compatibility
        - upstream
    - title: Features
      labels:
        - enhancement
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
