name: Official manifest canary

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-manifest-canary
  cancel-in-progress: true

jobs:
  check:
    name: Validate live stable manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq libarchive-tools

      - name: Check the official channel without mutation
        run: bin/devin-desktop-manager check
