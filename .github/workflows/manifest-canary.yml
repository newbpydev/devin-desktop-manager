name: Official manifest canary

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-manifest-canary
  cancel-in-progress: true

jobs:
  check:
    name: Validate live stable manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq libarchive-tools

      - name: Check the official channel without mutation
        run: bin/devin-desktop-manager check
