name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out annotated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require an annotated tag
        run: |
          test "$(git cat-file -t "${GITHUB_REF}")" = tag

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bats \
            desktop-file-utils \
            jq \
            libarchive-tools \
            ruby-bundler \
            ruby-dev \
            shellcheck \
            shared-mime-info \
            xdg-utils
          bundle config set --local deployment true
          bundle install

      - name: Verify and package exact version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle exec make release-check VERSION="${version}"

      - name: Attest source archive provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: dist/devin-desktop-manager-*.tar.gz

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Devin Desktop Manager ${GITHUB_REF_NAME}" \
            dist/devin-desktop-manager-*.tar.gz \
            dist/SHA256SUMS
