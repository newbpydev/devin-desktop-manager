name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bats \
            curl \
            desktop-file-utils \
            jq \
            libarchive-tools \
            ruby-bundler \
            ruby-dev \
            shellcheck \
            shared-mime-info \
            xdg-utils
          bundle config set --local deployment true
          bundle install

      - name: Run offline quality gate
        run: |
          make lint
          bundle exec make coverage
